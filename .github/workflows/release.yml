name: Build cross-platform release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: Package macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test and build
        run: |
          ./scripts/test-native.sh
          ./scripts/build-app.sh
          codesign --verify --deep --strict --verbose=2 dist/ReelForge.app
          lipo dist/ReelForge.app/Contents/MacOS/ReelForge -verify_arch arm64 x86_64
      - name: Create archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/ReelForge.app ReelForge-macOS-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ReelForge-macOS-universal
          path: ReelForge-macOS-universal.zip
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Package Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements-build.txt
      - name: Install Python dependencies
        run: python -m pip install -r windows/requirements-build.txt
      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          New-Item -ItemType Directory -Path windows\vendor -Force | Out-Null
          Copy-Item (Get-Command ffmpeg.exe).Source windows\vendor\ffmpeg.exe -Force
          Copy-Item (Get-Command ffprobe.exe).Source windows\vendor\ffprobe.exe -Force
      - name: Test
        run: python -m unittest discover -s windows/tests -v
      - name: Build packaged app
        run: python -m PyInstaller windows/ReelForgeWindows.spec --noconfirm --clean
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process `
            -FilePath "dist\ReelForge\ReelForge.exe" `
            -ArgumentList "--self-test" `
            -PassThru `
            -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged ReelForge self-test exited with $($process.ExitCode)"
          }
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path dist\ReelForge -DestinationPath ReelForge-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ReelForge-Windows-x64
          path: ReelForge-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-artifacts
        run: sha256sum *.zip > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: ReelForge ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            release-artifacts/ReelForge-macOS-universal.zip
            release-artifacts/ReelForge-Windows-x64.zip
            release-artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
